name: AuraPredict CI Quality Gate

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-gate:
    name: Code Quality, Security & Automated Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Run Static Code Analysis & Type Check
        run: npm run lint

      - name: Execute Automated Unit & Integration Tests
        run: npm run test

      - name: Compile Full-Stack Production Artifact
        run: npm run build
        env:
          NODE_ENV: production
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Verify Bundle Integrity
        run: |
          test -f dist/index.html || (echo "dist/index.html missing" && exit 1)
          test -f dist/server.cjs || (echo "dist/server.cjs missing" && exit 1)
          echo "Production build validation passed successfully."
