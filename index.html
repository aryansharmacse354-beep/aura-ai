<!doctype html>
<html lang="en" style="background-color: #020617; color: #f8fafc;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10B981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AuraPredict" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>AuraPredict AI - Spatio-Temporal Air Quality & Policy Platform</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #020617;
        color: #f8fafc;
        min-height: 100vh;
        width: 100vw;
        overflow: hidden;
      }
      @keyframes aura-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      // Self-healing: clear poisoned legacy service worker caches
      try {
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var i = 0; i < names.length; i++) {
              if (names[i] !== 'aurapredict-cache-v5') {
                caches.delete(names[i]);
              }
            }
          });
        }
      } catch (e) {}
    </script>
  </head>
  <body style="background-color: #020617; color: #f8fafc;">
    <div id="root">
      <!-- Fallback container until React mounts -->
      <div id="aura-preload-screen" style="min-height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; box-sizing: border-box;">
        <div style="width: 44px; height: 44px; border: 3px solid rgba(16, 185, 129, 0.2); border-top-color: #10b981; border-radius: 50%; animation: aura-spin 0.8s linear infinite;"></div>
        <h1 style="margin-top: 18px; font-size: 1.25rem; font-weight: 700; color: #f8fafc; letter-spacing: -0.01em;">AuraPredict AI</h1>
        <p style="margin-top: 6px; font-size: 0.85rem; color: #94a3b8; max-width: 380px;">Connecting to atmospheric telemetry network and neural forecasting models...</p>
        
        <div id="aura-recovery-action" style="display: none; margin-top: 24px; text-align: center;">
          <p style="font-size: 0.8rem; color: #fbbf24; margin-bottom: 12px;">Taking longer than usual? A previous cache may need resetting.</p>
          <button onclick="window.auraClearCacheAndReset()" style="padding: 9px 18px; background-color: #10b981; color: #020617; font-weight: 700; font-size: 0.85rem; border-radius: 8px; border: none; cursor: pointer; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);">
            Clear Cache &amp; Reload
          </button>
        </div>
      </div>
    </div>

    <script>
      // Recovery helper
      window.auraClearCacheAndReset = function() {
        try { localStorage.clear(); } catch(e) {}
        try { sessionStorage.clear(); } catch(e) {}
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            return Promise.all(keys.map(function(k) { return caches.delete(k); }));
          }).then(function() {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                return Promise.all(regs.map(function(r) { return r.unregister(); }));
              }).then(function() {
                window.location.reload(true);
              });
            } else {
              window.location.reload(true);
            }
          });
        } else {
          window.location.reload(true);
        }
      };

      // Show recovery button if React hasn't mounted after 3.5s
      setTimeout(function() {
        var el = document.getElementById('aura-recovery-action');
        if (el) el.style.display = 'block';
      }, 3500);

      // Register updated Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].update();
            }
          });
          navigator.serviceWorker.register('/sw.js').then(function(reg) {
            reg.addEventListener('updatefound', function() {
              var newWorker = reg.installing;
              if (newWorker) {
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    newWorker.postMessage('skipWaiting');
                  }
                });
              }
            });
          }).catch(function(err) {
            console.warn('SW registration skipped:', err);
          });
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
