<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Teal-Cyan Eco Wave Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Deep Sky & Atmosphere Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Data Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Clean White Backdrop -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ambient Atmospheric Orbit Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#E2E8F0" stroke-width="6" stroke-dasharray="12 16" />
  
  <!-- Outer Data Ring Arc -->
  <path d="M 120 256 A 136 136 0 0 1 392 256" fill="none" stroke="url(#blueGrad)" stroke-width="8" stroke-linecap="round" opacity="0.85" />
  
  <!-- Atmospheric Telemetry Orbit Nodes -->
  <circle cx="120" cy="256" r="8" fill="#2563EB" />
  <circle cx="256" cy="120" r="10" fill="#06B6D4" />
  <circle cx="392" cy="256" r="8" fill="#10B981" />

  <!-- Central Dynamic Leaf & Futuristic Atmosphere Wave Motif -->
  <!-- Left Eco Leaf Wing -->
  <path d="M 256 128 C 170 170, 140 270, 210 340 C 240 370, 256 384, 256 384 C 256 384, 256 310, 256 256 C 256 190, 256 128, 256 128 Z" 
        fill="url(#tealGrad)" opacity="0.95" />

  <!-- Right Futuristic Data Wave Wing -->
  <path d="M 256 128 C 342 170, 372 270, 302 340 C 272 370, 256 384, 256 384 C 256 384, 276 300, 310 256 C 330 230, 336 200, 256 128 Z" 
        fill="url(#blueGrad)" opacity="0.90" />

  <!-- Inner Dynamic Air Quality Stream Pulse Wave -->
  <path d="M 176 270 Q 216 230, 256 260 T 336 240" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />
  <path d="M 196 295 Q 226 265, 256 285 T 316 270" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.75" />

  <!-- Central Clean Air Core Ion Node -->
  <circle cx="256" cy="256" r="14" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="256" cy="256" r="8" fill="#06B6D4" />

  <!-- Bottom Brand Signature Typo Accent -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#0F172A" letter-spacing="4">AURA AQI</text>
  <text x="256" y="465" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#10B981" letter-spacing="3">ATMOSPHERIC INTELLIGENCE</text>
</svg>
