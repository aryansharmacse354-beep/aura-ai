<svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B0F17" />
      <stop offset="100%" stopColor="#1E293B" />
    </linearGradient>
    <linearGradient id="aqiSpectrum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#D90429" />
      <stop offset="20%" stopColor="#F72585" />
      <stop offset="40%" stopColor="#FB8500" />
      <stop offset="60%" stopColor="#FFB703" />
      <stop offset="80%" stopColor="#80B918" />
      <stop offset="100%" stopColor="#0097D8" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#10B981" />
      <stop offset="100%" stopColor="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="8"/>
  
  <!-- Outer Glow Arc -->
  <circle cx="256" cy="256" r="180" stroke="url(#aqiSpectrum)" stroke-width="16" stroke-linecap="round" stroke-dasharray="800 200" fill="none" filter="url(#glow)" opacity="0.4"/>
  <circle cx="256" cy="256" r="180" stroke="url(#aqiSpectrum)" stroke-width="16" stroke-linecap="round" stroke-dasharray="800 200" fill="none"/>

  <!-- Center Atmospheric Node & Shield Core -->
  <path d="M 256 120 L 370 170 C 370 290 256 380 256 380 C 256 380 142 290 142 170 Z" fill="url(#shieldGrad)" fill-opacity="0.15" stroke="url(#shieldGrad)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Inner Molecule/GNN Pulse Vectors -->
  <circle cx="256" cy="220" r="28" fill="#10B981" />
  <circle cx="200" cy="290" r="18" fill="#0097D8" />
  <circle cx="312" cy="290" r="18" fill="#FB8500" />
  <line x1="256" y1="220" x2="200" y2="290" stroke="#38BDF8" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="220" x2="312" y2="290" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <line x1="200" y1="290" x2="312" y2="290" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 6"/>

  <!-- Satellite / Wind Sparkles -->
  <circle cx="380" cy="140" r="10" fill="#38BDF8"/>
  <circle cx="130" cy="360" r="8" fill="#F43F5E"/>
  <circle cx="390" cy="380" r="8" fill="#10B981"/>
</svg>
